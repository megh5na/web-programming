<!DOCTYPE html>
<html>
<head>
    <title>23BCE1719</title>
    <link rel="stylesheet" href="form.css">
    <script src="form.js"></script>
</head>
<body onload="showTime()">
    <div class="form">
        <h2>Test JavaScript Form Validation</h2>
        <div id="time">Time:</div>
        <label>Name*:</label><input type="text" name="name" id="n"><br>
        <label>Address:</label><textarea name="address" id="a"></textarea><br>
        <label>Zip Code*:</label><input type="text" name="zip" id="z"><br>
        <label>Country*:</label><select name="country" id="c">
            <option value="">Select</option>
            <option value="in">India</option>
        </select><br>
        <label>Gender*:</label>
        <input type="radio" name="gender" value="m">Male
        <input type="radio" name="gender" value="f">Female<br>
        <label>Preferences*:</label>
        <input type="checkbox" name="pref" value="red">Red
        <input type="checkbox" name="pref" value="green">Green
        <input type="checkbox" name="pref" value="blue">Blue<br>
        <label>Phone*:</label><input type="text" name="phone" id="p"><br>
        <label>Email*:</label><input type="text" name="email" id="e"><br>
        <label>Password*:</label><input type="password" name="pass" id="pw"><br>
        <label>Verify Password*:</label><input type="password" name="vpass" id="vp"><br>
        <label>PAN Card*:</label><input type="text" name="pan" id="pan"><br>
        <button onclick="validate()">Submit</button>
    </div>
</body>
</html>
