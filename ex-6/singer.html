<!DOCTYPE html>
<html>
<head>
    <title>23BCE1719</title>
    <style>
        .myphoto {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid blue;
            display: block;
            margin: auto;
        }
        .title {
            text-align: center;
            font-family: Arial;
            animation: colorFont 4s infinite;
        }
        @keyframes colorFont {
            0% {
                color: red;
                font-size: 16px;
            }
            50% {
                color: green;
                font-size: 20px;
            }
            100% {
                color: blue;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <img src="kenny.jpg" class="myphoto" alt="Favorite Singer">
    <p class="title">My Favorite Singer</p>
</body>
</html>
