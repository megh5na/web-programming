<!DOCTYPE html>

<body onload="show()">
    <div id="rec"></div>
    <script>
        function show() {
            let n = sessionStorage.getItem("name");
            let i = sessionStorage.getItem("item");
            let p = sessionStorage.getItem("price");
            document.getElementById("rec").innerHTML = "Receipt<br>Name: " + n + "<br>Item: " + i + "<br>Price: " + p;
        }
    </script>
</body>
